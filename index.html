<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SECOND JACKPOT</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#40205b,#100d22 60%,#080912);color:#fff;font-family:system-ui,"Noto Sans JP",sans-serif;text-align:center}main{max-width:1050px;margin:auto;padding:25px 12px}h1{font-size:clamp(40px,8vw,95px);letter-spacing:-.05em;margin:0;color:#ffd66c;text-shadow:0 5px 0 #7d3c14,0 0 35px #e9a931}h2{margin:8px 0 24px;font-size:clamp(15px,3vw,24px)}.gold{color:#ffd66c}.banner{display:flex;justify-content:space-around;align-items:center;padding:20px;margin:20px 0;border:2px solid #6c567c;background:#1d1936;border-radius:22px}.timer{font-size:clamp(52px,10vw,105px);font-weight:1000;font-variant-numeric:tabular-nums}.status{font-size:clamp(13px,2.5vw,24px);font-weight:900}.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.team{border:2px solid #58486d;background:#201b32;border-radius:20px;padding:12px 8px}.team.mine{border-color:#ffdc78;box-shadow:0 0 25px #ffd66c66}.count{font-size:clamp(24px,5vw,52px);font-weight:900;margin:10px 0}.tap{width:100%;height:clamp(140px,25vw,255px);border:0;border-radius:22px;color:#fff;box-shadow:inset 0 8px 8px #ffffff55,0 10px 0 #080811,0 16px 25px #0009;font-size:clamp(75px,15vw,165px);font-weight:1000;cursor:pointer;touch-action:manipulation;user-select:none}.tap:active:not(:disabled){transform:translateY(7px);box-shadow:inset 0 3px 8px #0006,0 3px 0 #080811}.tap:disabled{filter:grayscale(.7) brightness(.5);cursor:not-allowed}.a{background:linear-gradient(150deg,#ff8597,#e21e56,#8c1145)}.b{background:linear-gradient(150deg,#91d6ff,#2576ef,#17318b)}.c{background:linear-gradient(150deg,#9fffd3,#13bd89,#08755b)}.rank{margin:15px 0 3px;color:#c5b9d2;font-weight:900}.info{margin:25px 0;padding:18px;border:2px solid #8b6939;border-radius:16px;background:#211b35;font-size:clamp(16px,3vw,28px);font-weight:900}.host{border:0;background:linear-gradient(#ffe595,#e8a62f);padding:14px 24px;border-radius:12px;font-weight:900;cursor:pointer}.foot{font-size:12px;color:#b3a8c3;margin-top:18px}.overlay{display:none;position:fixed;inset:0;background:#060413ef;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{max-width:470px;width:100%;background:#201a36;border:2px solid #ffd66c;border-radius:20px;padding:28px 18px}.choices{display:flex;gap:10px;margin:22px 0}.choices button{flex:1;border:0;border-radius:12px;padding:20px 0;color:white;font-size:45px;font-weight:900;cursor:pointer}.confirm{border:0;background:#ffd66c;border-radius:12px;padding:14px 30px;font-weight:900;cursor:pointer}.confirm:disabled{opacity:.35}.win{border-color:#ffd66c;animation:glow 1s infinite alternate}@keyframes glow{to{box-shadow:0 0 40px #ffd66c}}@media(max-width:600px){.teams{gap:5px}.team{padding:6px 3px;border-radius:12px}.tap{border-radius:10px}.rank{font-size:12px}}
</style></head><body><main><div class="gold">THE SECOND PLACE WINS</div><h1>SECOND JACKPOT</h1><h2>最多票は敗北。<span class="gold">2位だけが勝者！</span></h2><div class="banner"><div><div>TIME REMAINING</div><div class="timer" id="timer">06:00</div></div><div class="status" id="status">接続中…</div></div><p>陣営は最初に1つだけ選択。<b class="gold">途中変更不可！</b> 残り10秒で票数が消える！</p><div class="teams"><div class="team" id="team0"><b>RED TEAM</b><div class="count" id="count0">0</div><button class="tap a" id="tap0" disabled>A</button><div class="rank" id="rank0">—</div></div><div class="team" id="team1"><b>BLUE TEAM</b><div class="count" id="count1">0</div><button class="tap b" id="tap1" disabled>B</button><div class="rank" id="rank1">—</div></div><div class="team" id="team2"><b>GREEN TEAM</b><div class="count" id="count2">0</div><button class="tap c" id="tap2" disabled>C</button><div class="rank" id="rank2">—</div></div></div><div class="info" id="info">主催者のスタートを待っています</div><button class="host" id="host">★ 主催者：ゲーム開始 ★</button><div class="foot">1ゲーム6分。残り10秒は全員の票数・順位を非表示。<br>同票で2位が確定しない場合は引き分け。ゲームデータはサーバー再起動時に初期化されます。</div></main><div class="overlay" id="overlay"><div class="modal"><h2 class="gold">陣営を選べ！</h2><p>一度選んだら変更できません</p><div class="choices"><button class="a" data-choice="0">A</button><button class="b" data-choice="1">B</button><button class="c" data-choice="2">C</button></div><p id="choiceLabel">陣営を選択してください</p><button class="confirm" id="confirm" disabled>この陣営に決定！</button></div></div><script>
const $=x=>document.getElementById(x),names=['A','B','C'];let state={round:0,running:false,counts:[0,0,0],selected:null},offset=0,choice=null,pending=0,sending=false,lastRound=-1,hostPassword=sessionStorage.getItem('sj-host')||'';
async function post(path,obj){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}),j=await r.json();if(!r.ok)throw Error(j.error||'通信エラー');return j}
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=Number(b.dataset.choice);$('choiceLabel').textContent=names[choice]+'を選択中';$('confirm').disabled=false;document.querySelectorAll('[data-choice]').forEach(x=>x.style.outline=x===b?'4px solid #ffe184':'none')});
$('confirm').onclick=async()=>{try{await post('/api/choose',{choice});state.selected=choice;render()}catch(e){alert(e.message)}};
$('host').onclick=async()=>{if(!hostPassword){hostPassword=prompt('主催者パスワードを入力')||'';if(!hostPassword)return;sessionStorage.setItem('sj-host',hostPassword)}if(state.running&&!confirm('現在のゲームをリセットして再開しますか？'))return;try{await post('/api/start',{password:hostPassword})}catch(e){hostPassword='';sessionStorage.removeItem('sj-host');alert(e.message)}};
for(let i=0;i<3;i++)$('tap'+i).onclick=()=>{if(state.running&&state.selected===i&&Date.now()+offset<state.endAt)pending++};
setInterval(async()=>{if(sending||pending<1||!state.running)return;sending=true;let n=Math.min(50,pending);pending-=n;try{await post('/api/vote',{count:n})}catch(e){if(state.running&&Date.now()+offset<state.endAt)pending+=n}finally{sending=false}},100);
function render(){let rem=Math.max(0,(state.endAt||0)-(Date.now()+offset)),live=state.running&&rem>0,hidden=live&&rem<=10000,finished=state.started&&!live,sec=Math.ceil(rem/1000),ranks=state.counts?state.counts.map((n,i)=>({n,i})).sort((a,b)=>b.n-a.n):null;
$('timer').textContent=live?String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'):finished?'00:00':'06:00';$('status').textContent=hidden?'🔒 LAST 10 SECONDS':live?'🔥 連打受付中':finished?'🏆 結果発表':'WAITING';
for(let i=0;i<3;i++){$('tap'+i).disabled=!live||state.selected!==i;$('count'+i).textContent=hidden?'SECRET':(state.counts?.[i]??0).toLocaleString();$('rank'+i).textContent=hidden?'???':ranks?(ranks.findIndex(x=>x.i===i)+1)+'位':'—';$('team'+i).classList.toggle('mine',state.selected===i);$('team'+i).classList.toggle('win',finished&&ranks&&ranks[1].i===i&&ranks[0].n!==ranks[1].n&&ranks[1].n!==ranks[2].n)}
$('overlay').classList.toggle('show',live&&state.selected===null);
if(finished&&ranks){let tie=ranks[0].n===ranks[1].n||ranks[1].n===ranks[2].n;$('info').textContent=tie?'DRAW！同票のため引き分け': '🏆 '+names[ranks[1].i]+' TEAM JACKPOT！ 2位で勝利！'}else $('info').textContent=hidden?'🔒 集計を隠しています！':live?(state.selected===null?'陣営を選んで勝負！':'🔥 連打して2位を狙え！'):'主催者のスタートを待っています'}
setInterval(render,100);const es=new EventSource('/api/events');es.onmessage=e=>{let s=JSON.parse(e.data);if(lastRound!==s.round){lastRound=s.round;choice=null;pending=0;$('confirm').disabled=true;$('choiceLabel').textContent='陣営を選択してください';document.querySelectorAll('[data-choice]').forEach(x=>x.style.outline='none')}state=s;offset=s.serverNow-Date.now();render()};es.onerror=()=>{$('status').textContent='再接続中…'};
</script></body></html>
